<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E1930">
  <title>Offline — Marujo's Milhas</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#0E1930;color:#fff;padding:24px;text-align:center;
    }
    .card{
      max-width:360px;background:#16274A;border-radius:18px;padding:28px 22px;
      border:1px solid rgba(217,162,59,.35);box-shadow:0 20px 50px rgba(0,0,0,.35);
    }
    img{width:88px;height:88px;border-radius:18px;object-fit:cover;margin:0 auto 16px;display:block}
    h1{font-size:1.25rem;margin:0 0 10px;font-weight:700}
    p{margin:0 0 18px;color:#C2D0EC;font-size:.95rem;line-height:1.5}
    button{
      background:#D9A23B;color:#0E1930;border:none;border-radius:12px;
      padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;width:100%;
    }
    button:active{opacity:.9}
    a{color:#F0D9A8;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="Marujo's Milhas" width="88" height="88">
    <h1>Você está offline</h1>
    <p>Sem internet no momento. Assim que a conexão voltar, toque em tentar de novo para buscar passagens e ver seus pedidos.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
    <p style="margin-top:16px;margin-bottom:0;font-size:12px">
      <a href="/">Ir para o início</a>
    </p>
  </div>
</body>
</html>
